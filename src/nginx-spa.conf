# nginx-spa.conf
server {
  listen 80;
  server_name _;

  # Where your built files are copied in the Dockerfile
  root /usr/share/nginx/html;
  index index.html;

  # ---- Health check ----
  location = /healthz { return 200; }

  # ---- Static assets (cache hard) ----
  # Cache immutable, content-hashed assets for 1 year.
  # Adjust extensions as needed.
  location ~* \.(?:js|mjs|css|map|ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf)$ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Optional: service workers should not be cached too long
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # ---- API proxy (optional) ----
  # Uncomment and point to your backend container/service.
  # location /api/ {
  #   proxy_pass http://backend:8080;
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #   proxy_http_version 1.1;
  #   proxy_set_header Connection "";
  # }

  # ---- SPA fallback ----
  # For all other routes, serve index.html (client-side router)
  location / {
    # If file or dir exists, serve it; otherwise index.html
    try_files $uri $uri/ /index.html;
    # Keep HTML fresh so you can ship fixes without cache bust
    add_header Cache-Control "no-cache";
  }

  # ---- (Optional) Security headers (tune for your app) ----
  # add_header X-Content-Type-Options "nosniff" always;
  # add_header X-Frame-Options "DENY" always;
  # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Example CSP (relax as needed)
  # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
}
